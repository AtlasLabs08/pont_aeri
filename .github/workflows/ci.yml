name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instal.lar dependencies
        run: npm ci

      - name: Proves (fisica, instantania, exports)
        run: npm test

      - name: Comprovar que el build funciona
        run: npm run build
